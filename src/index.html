<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Equipe_X</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <img src="../assets/img/taskflow_logo.png" alt="Logo TaskFlow" class="logo">
        <h1>TaskFlow - Gerenciador de Tarefas</h1>

        <form id="form-tarefa">
            <input type="text" id="input-tarefa" placeholder="Digite uma nova tarefa..." required>
            <button type="submit">Adicionar</button>
        </form>

        <p id="mensagem-vazia" class="mensagem-vazia">Nenhuma tarefa cadastrada no momento.</p>

        <ul id="lista-tarefas"></ul>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
